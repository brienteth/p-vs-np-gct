name: 0G 24/7 Autonomous Agent Council

on:
  schedule:
    - cron: '*/20 * * * *' # Continuous loop every 20 minutes
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'run_actions_round.py'

permissions:
  contents: write
  actions: write

jobs:
  run-council-round:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies & Lean 4
        run: |
          pip install --upgrade pip
          pip install numpy aiohttp
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain stable
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Compile C Rank Engine & Run Retrospective Proofs (Python + Lean 4)
        run: |
          gcc -O3 -shared -fPIC -o paper_dc_perm4/exact_mod_rref.so paper_dc_perm4/exact_mod_rref.c
          python3 test_c_engine_contract.py
          python3 proofs_retrospective/verify_retrospective_claims.py
          lean proofs_retrospective/PvsNP_Retrospective.lean

      - name: Run Continuous 0G Council
        env:
          0G_API_KEY: ${{ secrets.ZERO_G_API_KEY || 'sk-79870bc0-1c98-411b-9131-9c42dd942a23' }}
        run: |
          python3 run_actions_round.py
